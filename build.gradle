plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {

	maven {
		url "https://maven.nucleoid.xyz/"
		name "Nucleoid"
	}
	maven { url 'https://jitpack.io' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Placeholder API
	modImplementation include("eu.pb4:placeholder-api:${project.placeholder_api_version}")

	// Twitch4J and its critical dependencies
	// Include them all in the JAR
	modImplementation include("com.github.twitch4j:twitch4j:${project.twitch4j_version}")

	// Include necessary transitive dependencies that might not be pulled automatically
	modImplementation include("com.github.philippheuer.events4j:events4j-api:0.12.2")
	modImplementation include("com.github.philippheuer.events4j:events4j-core:0.12.2")
	modImplementation include("com.github.philippheuer.events4j:events4j-handler-simple:0.12.2")

	modImplementation include("com.neovisionaries:nv-websocket-client:2.14")
	modImplementation include("io.github.xanthic.cache:cache-api:0.6.0")
	modImplementation include("io.github.xanthic.cache:cache-core:0.6.0")

	// These might also be needed
	modImplementation include("com.fasterxml.jackson.core:jackson-databind:2.15.2")
	modImplementation include("com.fasterxml.jackson.core:jackson-core:2.15.2")
	modImplementation include("com.fasterxml.jackson.core:jackson-annotations:2.15.2")
	modImplementation include("commons-io:commons-io:2.11.0")
	modImplementation include("org.apache.commons:commons-lang3:3.12.0")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}